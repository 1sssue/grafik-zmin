<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f5fa"><title>Шаблони відповідей</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5fa;--surface:#fff;--surface-2:#f7f8fc;--line:#e3e7f1;--line-strong:#cfd5e4;--fg:#141a2e;--muted:#6a7392;--accent:#2f5bff;--accent-ink:#fff;--accent-soft:#e8edff;--shadow:0 1px 2px rgba(20,26,46,.05),0 8px 24px rgba(20,26,46,.06);--font-display:'Manrope','Inter',system-ui,sans-serif;--font-body:'Inter',system-ui,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1220;--surface:#161b2e;--surface-2:#1b2136;--line:#262d46;--line-strong:#343c5b;--fg:#e9ecf8;--muted:#8e97b8;--accent:#7b97ff;--accent-ink:#0e1220;--accent-soft:#222c55;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1220;--surface:#161b2e;--surface-2:#1b2136;--line:#262d46;--line-strong:#343c5b;--fg:#e9ecf8;--muted:#8e97b8;--accent:#7b97ff;--accent-ink:#0e1220;--accent-soft:#222c55;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%;margin:0}body{display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-body);-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}h1,h2,p{margin:0}.top{flex:none;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}.top-in{width:95%;margin:auto;padding:12px 0;display:flex;align-items:center;gap:10px}.brand{font:800 18px var(--font-display)}.spacer{flex:1}.main{width:95%;max-width:1800px;margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column;padding:12px 0 6px;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:500;text-decoration:none;transition:background .15s,border-color .15s}.btn:hover{background:var(--surface-2);border-color:var(--accent)}.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.btn.primary:hover{filter:brightness(1.08)}.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}.btn.danger{color:#c0392b}.btn:disabled{opacity:.55;cursor:default}
.toolbar{display:flex;align-items:center;gap:10px;flex:none}.search{flex:1;min-width:120px;height:42px;padding:0 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface)}.columns{display:grid;grid-template-columns:minmax(220px,1fr) minmax(360px,2fr) minmax(220px,1fr);gap:14px;flex:1;min-height:0}.panel{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.panel h2{font:800 17px var(--font-display)}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.tools select{height:32px;max-width:130px;padding:0 6px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}.tabs{display:flex;gap:6px;margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:8px}.tabs button{border:0;border-radius:8px;padding:8px 14px;background:transparent;color:var(--muted);font-weight:700}.tabs button.on{background:var(--accent-soft);color:var(--accent)}.list{display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:0;padding:2px}.card{position:relative;border:1px solid var(--line);border-left:4px solid var(--tpl-color,var(--accent));border-radius:10px;background:var(--surface-2);padding:10px 11px;cursor:pointer}.card:hover{border-color:var(--line-strong);border-left-color:var(--tpl-color,var(--accent))}.card[draggable="true"]{cursor:grab}.card.dragging{opacity:.4}.card.drop-target{outline:2px dashed var(--accent)}.card-top{display:flex;align-items:center;gap:6px;min-width:0}.card-title{flex:1;min-width:0;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card-copy{white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:6px;font-size:13px;line-height:1.4}.keywords{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}.keywords span{font-size:10px;color:var(--muted);background:var(--surface);border-radius:999px;padding:2px 7px}.actions{display:flex;gap:4px;margin-top:8px;align-items:center}.actions button{padding:4px 7px;font-size:11px}.icon{border:0;background:none;color:var(--muted);padding:2px 5px;border-radius:6px}.icon.active{color:var(--accent)}.muted{color:var(--muted);font-size:12px}.empty{color:var(--muted);font-size:13px;padding:12px 4px}.footer{display:flex;justify-content:center;gap:12px;flex:none;padding:6px 0 12px}.footer .btn{width:190px;min-width:190px;height:40px}.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);z-index:100;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;max-width:calc(100% - 32px)}
.overlay{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(10,14,28,.5);backdrop-filter:blur(6px)}.modal{width:min(580px,100%);max-height:min(740px,90vh);display:flex;flex-direction:column;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 80px rgba(0,0,0,.35);padding:16px;gap:12px}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.modal h2{font:800 18px var(--font-display)}.form{display:flex;flex-direction:column;gap:12px}.form label{display:flex;flex-direction:column;gap:5px;font-weight:600}.form input[type=text],.form textarea{width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:9px;background:var(--surface);font:inherit}.form textarea{min-height:180px;resize:vertical}.checks{display:flex;flex-wrap:wrap;gap:16px}.checks label{display:flex;flex-direction:row;align-items:center}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}.auth{width:min(440px,92vw);margin:auto;padding:22px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.auth h2{margin-bottom:12px}.auth input{width:100%;height:40px;margin:6px 0;padding:0 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface)}.auth .btn{width:100%;margin-top:6px}.auth-note{min-height:22px;color:var(--muted);font-size:13px;margin-top:8px}
@media(max-width:900px){.columns{grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr)}.panel:nth-child(2){grid-column:1/-1;grid-row:1}.panel:first-child{grid-column:1;grid-row:2}.panel:last-child{grid-column:2;grid-row:2}.tools select{max-width:105px}.panel-head{align-items:flex-start}}
@media(max-width:650px){html,body{height:100%;overflow:hidden}.top-in{padding:8px 0}.main{width:100%;padding:10px 12px 4px}.toolbar{gap:6px}.toolbar .btn{height:40px;padding:0 9px;font-size:12px}.columns{display:flex;flex-direction:column;overflow:auto;gap:8px}.panel{flex:none;min-height:150px;max-height:33dvh;padding:10px}.panel-head{margin-bottom:6px}.panel h2{font-size:15px}.tools select{max-width:90px;font-size:11px}.tools .btn{font-size:10px;padding:4px 6px}.card{padding:8px}.card-copy{-webkit-line-clamp:2}.footer{gap:8px}.footer .btn{flex:1;width:auto;min-width:0}.form textarea{min-height:130px}}
</style>
</head>
<body>
<header class="top"><div class="top-in"><div class="brand">Шаблони відповідей</div><span class="spacer"></span></div></header>
<main class="main">
  <div class="auth" id="authBox" hidden><h2>Увійти</h2><p class="muted">Увійдіть, щоб переглядати й зберігати шаблони.</p><div id="authStep1"><input id="email" type="email" autocomplete="email" placeholder="name@example.com"><button class="btn primary" id="sendCode" type="button">Надіслати код</button></div><div id="authStep2" hidden><input id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="Код з листа"><button class="btn primary" id="verifyCode" type="button">Увійти</button><button class="btn" id="backLogin" type="button">Інша пошта</button></div><p id="authNote" class="auth-note"></p></div>
  <section id="templateApp" hidden style="display:flex;flex:1;min-height:0;flex-direction:column;gap:12px">
    <div class="toolbar"><input class="search" id="search" type="search" placeholder="Пошук за назвою, текстом або ключовими словами"><button class="btn primary" id="create">Створити шаблон</button></div>
    <div class="columns">
      <aside class="panel"><div class="panel-head"><h2>Базові</h2><button class="btn primary sm" id="createBasic">+ Додати</button></div><div class="tools"><select data-sort="basic"><option value="new">Нові</option><option value="old">Старі</option><option value="alpha">Абетка</option><option value="custom">Свій порядок</option></select><button class="btn sm" data-custom="basic">Свій порядок</button><button class="btn sm" data-reorder="basic">Редагувати порядок</button></div><div class="list" id="basicList"></div></aside>
      <section class="panel"><div class="tabs"><button class="on" data-view="mine" type="button">Мої</button><button data-view="shared" type="button">Спільні</button></div><div class="panel-head"><h2 id="collectionTitle">Мої шаблони</h2><div class="tools"><select data-sort="mine"><option value="new">Нові</option><option value="old">Старі</option><option value="alpha">Абетка</option><option value="custom">Свій порядок</option></select><button class="btn sm" data-custom="mine">Свій порядок</button><button class="btn sm" data-reorder="mine">Редагувати порядок</button></div></div><div class="list" id="collectionList"></div></section>
      <aside class="panel"><div class="panel-head"><h2>Обрані</h2><div class="tools"><select data-sort="favorites"><option value="new">Нові</option><option value="old">Старі</option><option value="alpha">Абетка</option><option value="custom">Свій порядок</option></select><button class="btn sm" data-custom="favorites">Свій порядок</button><button class="btn sm" data-reorder="favorites">Редагувати порядок</button></div></div><div class="list" id="favoriteList"></div></aside>
    </div>
  </section>
  <footer class="footer"><a class="btn" href="index.html">Календар</a><button class="btn" type="button" disabled>Скоро</button></footer>
</main>
<div class="overlay" id="editor" hidden><form class="modal form" id="templateForm"><div class="modal-head"><h2 id="editorTitle">Створити шаблон</h2><button class="btn sm" type="button" id="closeEditor">✕</button></div><label>Назва<input id="title" type="text" maxlength="140" required></label><label>Текст відповіді<textarea id="body" required></textarea></label><label>Ключові слова<input id="keywords" type="text" placeholder="Наприклад: доставка, повернення, оплата"></label><div class="checks"><label>Колір обводки <input id="color" type="color" value="#7a5af8"></label><label id="sharedWrap"><input id="isShared" type="checkbox"> Показувати всім у спільних</label></div><div class="form-actions"><button class="btn" type="button" id="cancelEditor">Скасувати</button><button class="btn primary" type="submit">Зберегти</button></div></form></div>
<div class="toast" id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="config.js"></script>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
try{const theme=localStorage.getItem('shifts.theme');if(theme==='dark'||theme==='light')document.documentElement.dataset.theme=theme}catch{}
let db=null,user=null,items=[],states={},view='mine',query='',sort={basic:'new',mine:'new',shared:'new',favorites:'new'},reorder={},editing=null,createBasic=false,dragId='',toastTimer;
function showToast(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3800)}
function stateOf(id){return states[id]||{pinned:false,favorite:false,sort_orders:{}}}
function matches(t){const q=query.trim().toLocaleLowerCase('uk');return !q||[t.title,t.body,...(t.keywords||[])].some(v=>String(v||'').toLocaleLowerCase('uk').includes(q))}
function sorted(rows,block){return [...rows].filter(matches).sort((a,b)=>{const sa=stateOf(a.id),sb=stateOf(b.id);if(!!sa.pinned!==!!sb.pinned)return sa.pinned?-1:1;if(sort[block]==='alpha')return a.title.localeCompare(b.title,'uk');if(sort[block]==='old')return new Date(a.created_at)-new Date(b.created_at);if(sort[block]==='custom'){const x=Number(sa.sort_orders?.[block]),y=Number(sb.sort_orders?.[block]);return(Number.isFinite(x)?x:1e9)-(Number.isFinite(y)?y:1e9)||new Date(b.created_at)-new Date(a.created_at)}return new Date(b.created_at)-new Date(a.created_at)})}
function card(t,block){const own=t.owner_id===user.id,s=stateOf(t.id),c=/^#[\da-f]{3,8}$/i.test(t.border_color||'')?t.border_color:'#7a5af8';return `<article class="card${dragId===t.id?' dragging':''}" data-id="${esc(t.id)}" data-block="${block}" style="--tpl-color:${c}" draggable="${!!reorder[block]}"><div class="card-top"><span class="card-title">${esc(t.title)}</span><button class="icon${s.pinned?' active':''}" data-action="pin" data-id="${esc(t.id)}" title="${s.pinned?'Відкріпити':'Закріпити'}">📌</button>${t.is_basic?'':`<button class="icon${s.favorite?' active':''}" data-action="favorite" data-id="${esc(t.id)}" title="${s.favorite?'Прибрати з обраних':'Додати в обране'}">${s.favorite?'★':'☆'}</button>`}</div><div class="card-copy">${esc(t.body)}</div>${(t.keywords||[]).length?`<div class="keywords">${t.keywords.map(k=>`<span>${esc(k)}</span>`).join('')}</div>`:''}<div class="actions">${own?`<button class="btn sm" data-action="edit" data-id="${esc(t.id)}">Редагувати</button><button class="btn sm" data-action="delete" data-id="${esc(t.id)}">Видалити</button>`:''}<span class="muted">${own?(t.is_shared?'Спільний':'Мій'):'Інший користувач'}</span></div></article>`}
function block(id,rows,key){$(id).innerHTML=rows.length?sorted(rows,key).map(t=>card(t,key)).join(''):'<p class="empty">Шаблонів не знайдено.</p>';const s=document.querySelector(`[data-sort="${key}"]`);if(s)s.value=sort[key];const b=document.querySelector(`[data-reorder="${key}"]`);if(b)b.textContent=reorder[key]?'Готово':'Редагувати порядок'}
function render(){const basic=items.filter(t=>t.is_basic),mine=items.filter(t=>t.owner_id===user?.id&&!t.is_basic),shared=items.filter(t=>t.owner_id!==user?.id&&t.is_shared&&!t.is_basic),favorites=items.filter(t=>!t.is_basic&&stateOf(t.id).favorite),key=view==='mine'?'mine':'shared';const cp=$('collectionList').closest('.panel');cp.querySelector('[data-sort]').dataset.sort=key;cp.querySelector('[data-custom]').dataset.custom=key;cp.querySelector('[data-reorder]').dataset.reorder=key;block('basicList',basic,'basic');block('collectionList',view==='mine'?mine:shared,key);block('favoriteList',favorites,'favorites');$('collectionTitle').textContent=view==='mine'?'Мої шаблони':'Спільні шаблони';document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===view))}
async function load(){if(!db||!user)return;for(const id of ['basicList','collectionList','favoriteList'])$(id).innerHTML='<p class="empty">Завантаження…</p>';const [a,b,c]=await Promise.all([db.from('reply_templates').select('*').eq('owner_id',user.id).order('created_at',{ascending:false}),db.from('reply_templates').select('*').eq('is_shared',true).eq('is_basic',false).neq('owner_id',user.id).order('created_at',{ascending:false}),db.from('reply_template_state').select('*').eq('user_id',user.id)]);const err=a.error||b.error||c.error;if(err){items=[];states={};render();$('basicList').innerHTML=`<p class="empty">${esc(err.message)}<br>Запустіть оновлений supabase/schema.sql. Якщо таблиці вже створені, оновіть кеш схеми: <code>NOTIFY pgrst, 'reload schema';</code></p>`;return}items=[...(a.data||[]),...(b.data||[])];states=Object.fromEntries((c.data||[]).map(x=>[x.template_id,x]));render()}
function openEditor(t=null,basic=false){editing=t?.id||null;createBasic=basic||!!t?.is_basic;$('editorTitle').textContent=t?'Редагувати шаблон':createBasic?'Базовий шаблон':'Створити шаблон';$('title').value=t?.title||'';$('body').value=t?.body||'';$('keywords').value=(t?.keywords||[]).join(', ');$('color').value=t?.border_color||'#7a5af8';$('isShared').checked=!!t?.is_shared;$('sharedWrap').hidden=createBasic;$('editor').hidden=false}
async function save(){const data={title:$('title').value.trim(),body:$('body').value.trim(),keywords:$('keywords').value.split(/[,;\n]/).map(x=>x.trim()).filter(Boolean),border_color:$('color').value,is_shared:createBasic?false:$('isShared').checked,is_basic:createBasic};if(!data.title||!data.body){showToast('Заповніть назву й текст шаблону.');return}const r=editing?await db.from('reply_templates').update({...data,updated_at:new Date().toISOString()}).eq('id',editing):await db.from('reply_templates').insert({...data,owner_id:user.id});if(r.error){showToast('Не вдалося зберегти: '+r.error.message);return}$('editor').hidden=true;await load();showToast('Шаблон збережено.')}
async function setState(id,patch){const s={...stateOf(id),...patch,user_id:user.id,template_id:id};const{error}=await db.from('reply_template_state').upsert(s,{onConflict:'user_id,template_id'});if(error){showToast('Помилка: '+error.message);return}states[id]=s;render()}
async function copyText(text){try{await navigator.clipboard.writeText(text)}catch{const a=document.createElement('textarea');a.value=text;a.style.position='fixed';a.style.opacity='0';document.body.append(a);a.select();document.execCommand('copy');a.remove()}showToast('Текст шаблону скопійовано.')}
async function move(blockKey,from,to){const list=$(`${blockKey==='basic'?'basicList':blockKey==='favorites'?'favoriteList':'collectionList'}`),ids=[...list.querySelectorAll('.card')].map(x=>x.dataset.id),a=ids.indexOf(from),b=ids.indexOf(to);if(a<0||b<0||a===b)return;ids.splice(b,0,ids.splice(a,1)[0]);sort[blockKey]='custom';const results=await Promise.all(ids.map((id,i)=>{const s=stateOf(id),sort_orders={...(s.sort_orders||{}),[blockKey]:i};return db.from('reply_template_state').upsert({...s,user_id:user.id,template_id:id,sort_orders},{onConflict:'user_id,template_id'}).then(({error})=>{if(!error)states[id]={...s,user_id:user.id,template_id:id,sort_orders};return error})}));const err=results.find(Boolean);if(err)showToast('Не вдалося зберегти порядок: '+err.message);render()}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.querySelectorAll('[data-sort]').forEach(s=>s.onchange=()=>{sort[s.dataset.sort]=s.value;render()});document.querySelectorAll('[data-custom]').forEach(b=>b.onclick=()=>{sort[b.dataset.custom]='custom';render()});document.querySelectorAll('[data-reorder]').forEach(b=>b.onclick=()=>{const k=b.dataset.reorder;reorder[k]=!reorder[k];if(reorder[k])sort[k]='custom';render()});
$('search').oninput=e=>{query=e.target.value;render()};$('create').onclick=()=>openEditor();$('createBasic').onclick=()=>openEditor(null,true);$('templateForm').onsubmit=e=>{e.preventDefault();save()};$('closeEditor').onclick=$('cancelEditor').onclick=()=>$('editor').hidden=true;$('editor').onclick=e=>{if(e.target===$('editor'))$('editor').hidden=true};
document.getElementById('templateApp').onclick=async e=>{const b=e.target.closest('[data-action]');if(b){e.stopPropagation();const t=items.find(x=>x.id===b.dataset.id);if(!t)return;const s=stateOf(t.id);if(b.dataset.action==='pin')return setState(t.id,{pinned:!s.pinned});if(b.dataset.action==='favorite')return setState(t.id,{favorite:!s.favorite});if(b.dataset.action==='edit')return openEditor(t);if(b.dataset.action==='delete'){if(confirm(`Видалити шаблон «${t.title}»?`)){const{error}=await db.from('reply_templates').delete().eq('id',t.id);if(error)showToast(error.message);else load()}return}}const c=e.target.closest('.card');if(c){const t=items.find(x=>x.id===c.dataset.id);if(t)copyText(t.body)}};
document.getElementById('templateApp').ondragstart=e=>{const c=e.target.closest('.card[draggable="true"]');if(!c)return;dragId=c.dataset.id;e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move'};document.getElementById('templateApp').ondragover=e=>{const c=e.target.closest('.card[draggable="true"]');if(c)e.preventDefault()};document.getElementById('templateApp').ondrop=e=>{const c=e.target.closest('.card[draggable="true"]');if(!c)return;e.preventDefault();move(c.dataset.block,e.dataTransfer.getData('text/plain'),c.dataset.id)};
async function boot(){const cfg=window.APP_CONFIG||{};if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY||!window.supabase){$('authBox').hidden=false;$('authNote').textContent='Підключення до Supabase не налаштовано.';return}db=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);const session=(await db.auth.getSession()).data.session;if(session)await enter(session.user);else $('authBox').hidden=false}
async function enter(u){user=u;$('authBox').hidden=true;$('templateApp').hidden=false;await load()}
$('sendCode').onclick=async()=>{const email=$('email').value.trim().toLowerCase();if(!email)return;const{error}=await db.auth.signInWithOtp({email,options:{shouldCreateUser:true}});if(error){$('authNote').textContent=error.message;return}$('authStep1').hidden=true;$('authStep2').hidden=false;$('authNote').textContent='Код надіслано. Перевірте пошту.'};$('verifyCode').onclick=async()=>{const{data,error}=await db.auth.verifyOtp({email:$('email').value.trim().toLowerCase(),token:$('code').value.trim(),type:'email'});if(error){$('authNote').textContent=error.message;return}await enter(data.user)};$('backLogin').onclick=()=>{$('authStep2').hidden=true;$('authStep1').hidden=false;$('authNote').textContent=''};
boot();
</script>
</body></html>
