/* Requested workspace width and single-column favorites */
.main{width:80%;max-width:none}
#favoriteList{grid-template-columns:minmax(0,1fr)}
/* Equal side panels and consistent 2:1 template cards */
.columns,.toolbar{grid-template-columns:minmax(0,1fr) minmax(0,2fr) minmax(0,1fr)}
#basicList,#collectionList,#favoriteList{grid-template-columns:repeat(3,minmax(0,1fr));align-content:start}
#basicList>.card,#collectionList>.card,#favoriteList>.card{width:100%;max-width:none;min-width:0;aspect-ratio:2 / 1;height:auto;min-height:0}
/* Requested template column counts */
#basicList{grid-template-columns:minmax(0,1fr)}
#collectionList{grid-template-columns:repeat(3,minmax(0,1fr))}
#favoriteList{grid-template-columns:minmax(0,1fr)}
/* Overall workspace width */
.main{width:90%;max-width:none}
/* Panel width ratio: Basic : My : Favorites = 1 : 3 : 1 */
.columns,.toolbar{grid-template-columns:minmax(0,1fr) minmax(0,3fr) minmax(0,1fr)}
/* Keep card text above its action row and expand only overflowing content */
#basicList>.card,#collectionList>.card,#favoriteList>.card{box-sizing:border-box;display:flex;flex-direction:column;min-width:0;overflow:hidden}
#basicList>.card .card-copy,#collectionList>.card .card-copy,#favoriteList>.card .card-copy{flex:1 1 auto;min-height:0;overflow:hidden}
#basicList>.card .card-footer,#collectionList>.card .card-footer,#favoriteList>.card .card-footer{position:relative;z-index:1;flex:none;margin-top:auto}
#basicList>.card.expanded,#collectionList>.card.expanded,#favoriteList>.card.expanded{height:auto!important;min-height:0;aspect-ratio:auto;overflow:visible}
#basicList>.card.expanded .card-copy,#collectionList>.card.expanded .card-copy,#favoriteList>.card.expanded .card-copy{flex:initial;overflow:visible}
.expand-action[hidden]{display:none!important}
/* Template titles: stable two-line area with a soft bottom fade and ellipsis */
#basicList>.card .template-title,#collectionList>.card .template-title,#favoriteList>.card .template-title{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;flex:0 0 auto;min-height:2.5em;max-height:2.5em;line-height:1.25;overflow:hidden;text-overflow:ellipsis;overflow-wrap:anywhere;-webkit-mask-image:linear-gradient(to bottom,#000 72%,transparent 100%);mask-image:linear-gradient(to bottom,#000 72%,transparent 100%)}
#basicList>.card.expanded .template-title,#collectionList>.card.expanded .template-title,#favoriteList>.card.expanded .template-title{display:block;min-height:0;max-height:none;-webkit-line-clamp:unset;overflow:visible;-webkit-mask-image:none;mask-image:none}
/* Tighter title spacing and progressive body text fade after the first three lines */
#basicList>.card .template-title,#collectionList>.card .template-title,#favoriteList>.card .template-title{margin-bottom:1px}
#basicList>.card .card-copy,#collectionList>.card .card-copy,#favoriteList>.card .card-copy{display:block;-webkit-line-clamp:unset;margin-top:0;line-height:1.4;overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 44%,rgba(0,0,0,.82) 62%,rgba(0,0,0,.42) 82%,transparent 100%);mask-image:linear-gradient(to bottom,#000 0%,#000 44%,rgba(0,0,0,.82) 62%,rgba(0,0,0,.42) 82%,transparent 100%)}
#basicList>.card.expanded .card-copy,#collectionList>.card.expanded .card-copy,#favoriteList>.card.expanded .card-copy{display:block;-webkit-mask-image:none;mask-image:none}
/* Keep title-to-body spacing identical in collapsed and expanded cards */
#basicList>.card .template-title,#collectionList>.card .template-title,#favoriteList>.card .template-title{min-height:0;height:auto;max-height:2.5em;margin-bottom:1px}
#basicList>.card.expanded .template-title,#collectionList>.card.expanded .template-title,#favoriteList>.card.expanded .template-title{min-height:0;height:auto;margin-bottom:1px}
/* Slightly more space between template title and body */
#basicList>.card .template-title,#collectionList>.card .template-title,#favoriteList>.card .template-title,#basicList>.card.expanded .template-title,#collectionList>.card.expanded .template-title,#favoriteList>.card.expanded .template-title{margin-bottom:5px}
/* Snappy drag sorting and subtle compression feedback on copy */
.card.dragging{transition:transform .1s ease,box-shadow .1s ease}
#basicList,#collectionList,#favoriteList{transition:background-color .12s ease}
@keyframes template-copy-pulse{0%{transform:scale(1)}35%{transform:scale(.975)}70%{transform:scale(.975)}100%{transform:scale(1)}}</style>

<header class="top"><div class="top-in"><div class="brand"><span class="mark"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="2" y="3" width="12" height="11" rx="2.5"/><path d="M2 7h12M5.5 1.5v3M10.5 1.5v3"/></svg></span>Шаблони</div><span class="spacer"></span><div class="top-actions"><span class="mail-badge" id="userMail" hidden></span><button class="btn icon-btn" id="themeBtn" type="button" aria-label="Змінити тему" title="Світла / темна тема">◐</button><a class="btn" id="adminLink" href="index.html#admin" hidden>Адмін</a><a class="btn" href="index.html#data">Імпорт / Експорт</a><button class="btn" id="logoutBtn" type="button" hidden>Вийти</button></div></div></header>
<main class="main">
  <div class="auth" id="authBox" hidden><h2>Увійти</h2><p class="muted">Увійдіть, щоб переглядати й зберігати шаблони.</p><div id="authStep1"><input id="email" type="email" autocomplete="email" placeholder="name@example.com"><button class="btn primary" id="sendCode" type="button">Надіслати код</button></div><div id="authStep2" hidden><input id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="Код з листа"><button class="btn primary" id="verifyCode" type="button">Увійти</button><button class="btn" id="backLogin" type="button">Інша пошта</button></div><p id="authNote" class="auth-note"></p></div>

      <section class="panel"><div class="tabs"><button class="on" data-view="mine" type="button">Мої</button><button data-view="shared" type="button">Спільні</button></div><div class="panel-heading"><h2 id="collectionTitle">Мої шаблони</h2></div><div class="tools panel-sort"><select data-sort="mine"><option value="new">Нові</option><option value="old">Старі</option><option value="alpha">Абетка</option><option value="custom">Свій порядок</option></select><button class="icon edit-order" type="button" data-reorder="mine" aria-label="Редагувати порядок" title="Редагувати порядок" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg></button></div><div class="list" id="collectionList"></div></section>

    </div>
  </section>

</main>
<div class="overlay" id="greetingEditor" hidden><form class="modal form" id="greetingForm"><div class="modal-head"><h2>Редагувати привітання</h2><button class="btn sm" type="button" id="closeGreeting">✕</button></div><label>Текст шаблону<textarea id="greetingBody" required></textarea></label><p class="muted">Змінні: {{greeting}} — привітання за часом доби, {{name}} — ім’я з поля в картці.</p><div class="form-actions"><button class="btn" type="button" id="cancelGreeting">Скасувати</button><button class="btn primary" type="submit">Зберегти</button></div></form></div><div class="overlay" id="editor" hidden><form class="modal form" id="templateForm"><div class="modal-head"><h2 id="editorTitle">Створити шаблон</h2><button class="btn sm" type="button" id="closeEditor">✕</button></div><label>Назва<input id="title" type="text" maxlength="140" required></label><label>Текст відповіді<textarea id="body" required></textarea></label><label>Ключові слова<input id="keywords" type="text" placeholder="Наприклад: доставка, повернення, оплата"></label><div class="checks"><label>Колір обводки <input id="color" type="color" value="#7a5af8"></label><label id="sharedWrap"><input id="isShared" type="checkbox"> Показувати всім у спільних</label></div><div class="form-actions"><button class="btn" type="button" id="cancelEditor">Скасувати</button><button class="btn primary" type="submit">Зберегти</button></div></form></div>
<div class="toast" id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="config.js"></script>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
try{const theme=localStorage.getItem('shifts.theme');if(theme==='dark'||theme==='light')document.documentElement.dataset.theme=theme}catch{}
let db=null,user=null,items=[],states={},view='mine',query='',sort={basic:'new',mine:'new',shared:'new',favorites:'new'},reorder={},lastGreeting='',editing=null,createBasic=false,dragId='',dragOrigin='',expanded=new Set(),toastTimer;
function showToast(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3800)}
function stateOf(id){return states[id]||{pinned:false,favorite:false,sort_orders:{}}}
function matches(t){const q=query.trim().toLocaleLowerCase('uk');return !q||[t.title,t.body,...(t.keywords||[])].some(v=>String(v||'').toLocaleLowerCase('uk').includes(q))}
function sorted(rows,block){return [...rows].filter(t=>block==='basic'||matches(t)).sort((a,b)=>{const sa=stateOf(a.id),sb=stateOf(b.id);if(!!sa.pinned!==!!sb.pinned)return sa.pinned?-1:1;if(sort[block]==='alpha')return a.title.localeCompare(b.title,'uk');if(sort[block]==='old')return new Date(a.created_at)-new Date(b.created_at);if(sort[block]==='custom'){const x=Number(sa.sort_orders?.[block]),y=Number(sb.sort_orders?.[block]);return(Number.isFinite(x)?x:1e9)-(Number.isFinite(y)?y:1e9)||new Date(b.created_at)-new Date(a.created_at)}return new Date(b.created_at)-new Date(a.created_at)})}function card(t,block){const own=t.owner_id===user.id,s=stateOf(t.id),c=/^#[\da-f]{3,8}$/i.test(t.border_color||'')?t.border_color:'#7a5af8',isCollection=block==='mine'||block==='shared',isExpanded=expanded.has(t.id),expandedClass=isExpanded?' expanded':'';const pin=`<button class="card-action${s.pinned?' active':''}" type="button" data-action="pin" data-id="${esc(t.id)}" title="${s.pinned?'Відкріпити':'Закріпити'}" aria-label="${s.pinned?'Відкріпити':'Закріпити'}" aria-pressed="${!!s.pinned}"><svg class="pin-icon" viewBox="0 0 24 24"><path d="m16 3 5 5-4 1-4 4-1 5-2-2-5 5-2-2 5-5-2-2 5-1 4-4z"/></svg></button>`;const fav=`<button class="card-action${s.favorite?' active':''}" type="button" data-action="favorite" data-id="${esc(t.id)}" title="${s.favorite?'Прибрати з обраних':'Додати в обране'}" aria-label="${s.favorite?'Прибрати з обраних':'Додати в обране'}" aria-pressed="${!!s.favorite}"><svg class="star-icon" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9z"/></svg></button>`;const toBasic=own&&!t.is_basic?`<button class="card-action" type="button" data-action="to-basic" data-id="${esc(t.id)}" title="Додати до базових" aria-label="Додати до базових"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM8 9h8M8 13h5"/><path d="M18 3v4M16 5h4"/></svg></button>`:'';const basicAction=own&&t.is_basic?`<button class="card-action" type="button" data-action="from-basic" data-id="${esc(t.id)}" title="Прибрати з базових" aria-label="Прибрати з базових"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM8 9h8M8 13h5"/><path d="M16 5h4"/></svg></button>`:'';const expand=`<button class="card-action expand-action" type="button" data-action="expand" data-id="${esc(t.id)}" aria-expanded="${isExpanded}" title="${isExpanded?'Згорнути':'Розгорнути'}" aria-label="${isExpanded?'Згорнути шаблон':'Розгорнути шаблон'}"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>`;const edit=own?`<button class="card-action" type="button" data-action="edit" data-id="${esc(t.id)}" title="Редагувати" aria-label="Редагувати"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg></button>`:'';const del=own?`<button class="card-action danger-action" type="button" data-action="delete" data-id="${esc(t.id)}" title="Видалити" aria-label="Видалити"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6"/></svg></button>`:'';return `<article class="card${isCollection?' collection-card':''}${expandedClass}" data-id="${esc(t.id)}" data-block="${block}" style="--tpl-color:${c}" draggable="${isCollection||sort[block]==='custom'}"><div class="template-title">${esc(t.title)}</div><div class="card-copy">${esc(t.body)}</div>${(t.keywords||[]).length?`<div class="keywords">${t.keywords.map(k=>`<span>${esc(k)}</span>`).join('')}</div>`:''}<div class="card-footer"><div class="card-tools-left">${pin}${t.is_basic?'':fav}${toBasic}${basicAction}</div><div class="card-tools-right">${expand}${edit}${del}</div></div></article>`}const defaultGreetingBody='{{greeting}}! Як я можу до Вас звертатись? Мене звати {{name}}, команда підтримки Нової пошти. ❤️';let greeting={name:'',body:defaultGreetingBody};function greetingForNow(){const mins=new Date().getHours()*60+new Date().getMinutes();if(mins>=300&&mins<660)return 'Доброго ранку';if(mins>=660&&mins<1080)return 'Добрий день';if(mins>=1080&&mins<1380)return 'Добрий вечір';return 'Доброї ночі'}function greetingText(){return greeting.body.replaceAll('{{greeting}}',greetingForNow()).replaceAll('{{name}}',greeting.name.trim())}function saveGreeting(){try{localStorage.setItem('replyGreeting:'+user.id,JSON.stringify(greeting))}catch{}}function loadGreeting(){greeting={name:'',body:defaultGreetingBody};try{const x=JSON.parse(localStorage.getItem('replyGreeting:'+user.id)||'null');if(x)greeting={...greeting,...x}}catch{}}
function greetingCard(){const isExpanded=expanded.has('__greeting');return `<article class="card greeting-card${isExpanded?' expanded':''}" data-greeting-card><div class="template-title">Привітання</div><div class="greeting-preview" id="greetingPreview">${esc(greetingText())}</div><div class="card-footer"><div class="card-tools-left"><input class="greeting-name" id="greetingName" value="${esc(greeting.name)}" placeholder="Ваше ім’я"><span class="muted">Закріплено</span></div><div class="card-tools-right"><button class="card-action expand-action" type="button" data-action="expand" data-id="__greeting" aria-expanded="${isExpanded}" title="${isExpanded?'Згорнути':'Розгорнути'}" aria-label="${isExpanded?'Згорнути привітання':'Розгорнути привітання'}"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button><button class="card-action" type="button" data-greeting-edit aria-label="Редагувати привітання" title="Редагувати шаблон"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg></button></div></div></article>`}function block(id,rows,key){const filtered=sorted(rows,key),showGreeting=key==='basic',list=filtered.map(t=>card(t,key)).join(''),empty=!showGreeting&&!filtered.length?'<p class="empty">Шаблонів не знайдено.</p>':'';$(id).innerHTML=(showGreeting?greetingCard():'')+list+empty;requestAnimationFrame(()=>{$(id).querySelectorAll('.card').forEach(card=>{const toggle=card.querySelector('.expand-action');if(!toggle)return;const overflow=[...card.querySelectorAll('.template-title,.card-copy,.keywords,.greeting-preview')].some(el=>el.scrollHeight>el.clientHeight+1||el.scrollWidth>el.clientWidth+1);toggle.hidden=!overflow&&!card.classList.contains('expanded')})});const s=document.querySelector(`[data-sort="${key}"]`);if(s)s.value=sort[key];const b=document.querySelector(`[data-reorder="${key}"]`);if(b){b.hidden=sort[key]!=='custom';b.classList.toggle('active',!!reorder[key]);b.title=reorder[key]?'Завершити редагування порядку':'Редагувати порядок';b.setAttribute('aria-label',b.title)}}function render(){const basic=items.filter(t=>t.is_basic),mine=items.filter(t=>t.owner_id===user?.id&&!t.is_basic&&!stateOf(t.id).favorite),shared=items.filter(t=>t.owner_id!==user?.id&&t.is_shared&&!t.is_basic),favorites=items.filter(t=>!t.is_basic&&stateOf(t.id).favorite),key=view==='mine'?'mine':'shared';const cp=$('collectionList').closest('.panel');cp.querySelector('[data-sort]').dataset.sort=key;cp.querySelector('[data-reorder]').dataset.reorder=key;block('basicList',basic,'basic');block('collectionList',view==='mine'?mine:shared,key);block('favoriteList',favorites,'favorites');$('collectionTitle').textContent=view==='mine'?'Мої шаблони':'Спільні шаблони';document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===view))}async function load(){if(!db||!user)return;for(const id of ['basicList','collectionList','favoriteList'])$(id).innerHTML='<p class="empty">Завантаження…</p>';const [a,b,c]=await Promise.all([db.from('reply_templates').select('*').eq('owner_id',user.id).order('created_at',{ascending:false}),db.from('reply_templates').select('*').eq('is_shared',true).eq('is_basic',false).neq('owner_id',user.id).order('created_at',{ascending:false}),db.from('reply_template_state').select('*').eq('user_id',user.id)]);const err=a.error||b.error||c.error;if(err){items=[];states={};render();$('basicList').innerHTML=`<p class="empty">${esc(err.message)}<br>Запустіть оновлений supabase/schema.sql. Якщо таблиці вже створені, оновіть кеш схеми: <code>NOTIFY pgrst, 'reload schema';</code></p>`;return}items=[...(a.data||[]),...(b.data||[])];states=Object.fromEntries((c.data||[]).map(x=>[x.template_id,x]));render()}
function openEditor(t=null,basic=false){editing=t?.id||null;createBasic=basic||!!t?.is_basic;$('editorTitle').textContent=t?'Редагувати шаблон':createBasic?'Базовий шаблон':'Створити шаблон';$('title').value=t?.title||'';$('body').value=t?.body||'';$('keywords').value=(t?.keywords||[]).join(', ');$('color').value=t?.border_color||'#7a5af8';$('isShared').checked=t?!!t.is_shared:true;$('sharedWrap').hidden=createBasic;$('editor').hidden=false}
async function save(){const data={title:$('title').value.trim(),body:$('body').value.trim(),keywords:$('keywords').value.split(/[,;\n]/).map(x=>x.trim()).filter(Boolean),border_color:$('color').value,is_shared:createBasic?false:$('isShared').checked,is_basic:createBasic};if(!data.title||!data.body){showToast('Заповніть назву й текст шаблону.');return}const r=editing?await db.from('reply_templates').update({...data,updated_at:new Date().toISOString()}).eq('id',editing):await db.from('reply_templates').insert({...data,owner_id:user.id});if(r.error){showToast('Не вдалося зберегти: '+r.error.message);return}$('editor').hidden=true;await load();showToast('Шаблон збережено.')}
async function setState(id,patch){const previous=stateOf(id),s={...previous,...patch,user_id:user.id,template_id:id};states[id]=s;render();const{error}=await db.from('reply_template_state').upsert(s,{onConflict:'user_id,template_id'});if(error){states[id]=previous;render();showToast('Помилка: '+error.message)}}
async function copyText(text){try{await navigator.clipboard.writeText(text)}catch{const a=document.createElement('textarea');a.value=text;a.style.position='fixed';a.style.opacity='0';document.body.append(a);a.select();document.execCommand('copy');a.remove()}showToast('Текст шаблону скопійовано.')}async function copyCard(el,text){el.classList.remove('copy-pulse');void el.offsetWidth;el.classList.add('copy-pulse');setTimeout(()=>el.classList.remove('copy-pulse'),800);await copyText(text)}
async function move(blockKey,from,to){const list=$(blockKey==='basic'?'basicList':blockKey==='favorites'?'favoriteList':'collectionList'),ids=[...list.querySelectorAll('.card[data-id]')].map(x=>x.dataset.id),a=ids.indexOf(from),b=ids.indexOf(to);if(a<0||b<0||a===b){dragId='';dragOrigin='';return}ids.splice(b,0,ids.splice(a,1)[0]);sort[blockKey]='custom';const updates=ids.map((id,i)=>{const s=stateOf(id),sort_orders={...(s.sort_orders||{}),[blockKey]:i};states[id]={...s,user_id:user.id,template_id:id,sort_orders};return{id,state:states[id]}});dragId='';dragOrigin='';render();const results=await Promise.all(updates.map(({state})=>db.from('reply_template_state').upsert(state,{onConflict:'user_id,template_id'}).then(({error})=>error)));const err=results.find(Boolean);if(err){showToast('Не вдалося зберегти порядок: '+err.message);await load()}}
async function setBasic(id,isBasic){const t=items.find(x=>x.id===id);if(!t)return;dragId='';dragOrigin='';if(isBasic&&t.owner_id!==user.id){const tempId=`pending-basic-${Date.now()}`,copy={...t,id:tempId,owner_id:user.id,is_shared:false,is_basic:true,created_at:new Date().toISOString()};items.unshift(copy);render();const{data,error}=await db.from('reply_templates').insert({owner_id:user.id,title:t.title,body:t.body,keywords:t.keywords||[],border_color:t.border_color||'#7a5af8',is_shared:false,is_basic:true}).select().single();if(error){items=items.filter(x=>x.id!==tempId);render();showToast('Не вдалося змінити базові шаблони: '+error.message);return}items=items.map(x=>x.id===tempId?data:x);render()}else{const previous={is_basic:t.is_basic,is_shared:t.is_shared,updated_at:t.updated_at};t.is_basic=isBasic;t.is_shared=isBasic?false:t.is_shared;t.updated_at=new Date().toISOString();render();const{error}=await db.from('reply_templates').update({is_basic:isBasic,is_shared:t.is_shared,updated_at:t.updated_at}).eq('id',id);if(error){Object.assign(t,previous);render();showToast('Не вдалося змінити базові шаблони: '+error.message);return}}showToast(isBasic?'Додано до базових':'Прибрано з базових')}async function addToMine(id){const t=items.find(x=>x.id===id);if(!t)return;if(t.owner_id===user.id){showToast('Це вже ваш шаблон.');return}dragId='';dragOrigin='';const tempId=`pending-mine-${Date.now()}`,copy={...t,id:tempId,owner_id:user.id,is_shared:false,is_basic:false,created_at:new Date().toISOString()};items.unshift(copy);render();const{data,error}=await db.from('reply_templates').insert({owner_id:user.id,title:t.title,body:t.body,keywords:t.keywords||[],border_color:t.border_color||'#7a5af8',is_shared:false,is_basic:false}).select().single();if(error){items=items.filter(x=>x.id!==tempId);render();showToast('Не вдалося додати до моїх шаблонів: '+error.message);return}items=items.map(x=>x.id===tempId?data:x);render();showToast('Додано до моїх шаблонів')}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.querySelectorAll('[data-sort]').forEach(s=>s.onchange=()=>{sort[s.dataset.sort]=s.value;if(s.value!=='custom')reorder[s.dataset.sort]=false;render()});document.querySelectorAll('[data-reorder]').forEach(b=>b.onclick=()=>{const k=b.dataset.reorder;reorder[k]=!reorder[k];render()});
$('search').oninput=e=>{query=e.target.value;render()};$('create').onclick=()=>openEditor();$('templateForm').onsubmit=e=>{e.preventDefault();save()};$('closeEditor').onclick=$('cancelEditor').onclick=()=>$('editor').hidden=true;$('editor').onclick=e=>{if(e.target===$('editor'))$('editor').hidden=true};
$('templateApp').addEventListener('input',e=>{if(e.target.id!=='greetingName')return;greeting.name=e.target.value;saveGreeting();const p=$('greetingPreview');if(p)p.textContent=greetingText()});const openGreeting=()=>{$('greetingBody').value=greeting.body;$('greetingEditor').hidden=false};$('closeGreeting').onclick=$('cancelGreeting').onclick=()=>$('greetingEditor').hidden=true;$('greetingEditor').onclick=e=>{if(e.target===$('greetingEditor'))$('greetingEditor').hidden=true};$('greetingForm').onsubmit=e=>{e.preventDefault();greeting.body=$('greetingBody').value.trim();saveGreeting();$('greetingEditor').hidden=true;render()};document.getElementById('templateApp').onclick=async e=>{if(e.target.closest('[data-greeting-edit]')){e.stopPropagation();openGreeting();return}if(e.target.closest('#greetingName'))return;const b=e.target.closest('[data-action]');if(b){e.stopPropagation();const action=b.dataset.action,id=b.dataset.id;if(action==='expand'){if(expanded.has(id))expanded.delete(id);else expanded.add(id);render();return}const t=items.find(x=>x.id===id);if(!t)return;const s=stateOf(t.id);if(action==='pin')return setState(t.id,{pinned:!s.pinned});if(action==='favorite')return setState(t.id,{favorite:!s.favorite});if(action==='to-basic')return setBasic(t.id,true);if(action==='from-basic')return setBasic(t.id,false);if(action==='edit')return openEditor(t);if(action==='delete'){if(confirm(`Видалити шаблон «${t.title}»?`)){const{error}=await db.from('reply_templates').delete().eq('id',t.id);if(error)showToast(error.message);else load()}return}}const gc=e.target.closest('[data-greeting-card]');if(gc){if(!greeting.name.trim()){showToast('Вкажіть своє ім’я в полі привітання.');$('greetingName').focus();return}await copyCard(gc,greetingText());return}const c=e.target.closest('.card:not([data-greeting-card])');if(c){const t=items.find(x=>x.id===c.dataset.id);if(t)await copyCard(c,t.body)}};document.getElementById('templateApp').ondragstart=e=>{const c=e.target.closest('.card[draggable="true"]');if(!c)return;dragId=c.dataset.id;dragOrigin=c.closest('.list')?.id||'';c.classList.add('dragging');e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move'};
document.getElementById('templateApp').ondragover=e=>{const tab=e.target.closest('[data-view="mine"]');if(tab&&dragOrigin==='collectionList'&&view==='shared'){e.preventDefault();tab.classList.add('drop-target');return}const zone=e.target.closest('#basicList,#favoriteList,#collectionList');if(zone&&((zone.id==='basicList'&&dragOrigin!=='basicList')||(zone.id==='favoriteList'&&dragOrigin!=='favoriteList')||(zone.id==='collectionList'&&view==='mine'&&dragOrigin!=='collectionList'))){e.preventDefault();zone.classList.add('drop-target');return}const c=e.target.closest('.card[draggable="true"]');if(c&&sort[c.dataset.block]==='custom')e.preventDefault()};
document.getElementById('templateApp').ondragleave=e=>{const target=e.target.closest('#basicList,#favoriteList,#collectionList,[data-view="mine"]');if(target&&!target.contains(e.relatedTarget))target.classList.remove('drop-target')};
document.getElementById('templateApp').ondrop=async e=>{const id=e.dataTransfer.getData('text/plain')||dragId,tab=e.target.closest('[data-view="mine"]');if(tab&&dragOrigin==='collectionList'&&view==='shared'){e.preventDefault();tab.classList.remove('drop-target');dragId='';dragOrigin='';await addToMine(id);return}const zone=e.target.closest('#basicList,#favoriteList,#collectionList');if(zone&&((zone.id==='basicList'&&dragOrigin!=='basicList')||(zone.id==='favoriteList'&&dragOrigin!=='favoriteList')||(zone.id==='collectionList'&&view==='mine'&&dragOrigin!=='collectionList'))){e.preventDefault();zone.classList.remove('drop-target');const origin=dragOrigin;dragId='';dragOrigin='';if(zone.id==='basicList')await setBasic(id,true);else if(zone.id==='favoriteList')await setState(id,{favorite:true});else if(origin==='basicList')await setBasic(id,false);else{const t=items.find(x=>x.id===id);if(t?.owner_id===user.id)await setState(id,{favorite:false});else await addToMine(id)}return}const c=e.target.closest('.card[draggable="true"]');if(!c)return;const targetBlock=c.dataset.block;if(!reorder[targetBlock])return;e.preventDefault();await move(targetBlock,id,c.dataset.id)};
document.getElementById('templateApp').ondragend=e=>{document.querySelectorAll('.card.dragging').forEach(x=>x.classList.remove('dragging'));document.querySelectorAll('.list.drop-target,[data-view].drop-target').forEach(x=>x.classList.remove('drop-target'));dragId='';dragOrigin=''};function themeIsDark(){return document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches}function applyTheme(){let t='';try{t=localStorage.getItem('shifts.theme')||''}catch{}if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme;$('themeBtn').textContent=themeIsDark()?'☼':'◐'}$('themeBtn').onclick=()=>{document.documentElement.dataset.theme=themeIsDark()?'light':'dark';try{localStorage.setItem('shifts.theme',document.documentElement.dataset.theme)}catch{}applyTheme()};applyTheme();$('logoutBtn').onclick=async()=>{if(db)await db.auth.signOut();try{localStorage.removeItem('shifts.owner')}catch{}location.href='index.html'};
async function boot(){const cfg=window.APP_CONFIG||{};if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY||!window.supabase){$('authBox').hidden=false;$('authNote').textContent='Підключення до Supabase не налаштовано.';return}db=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);const session=(await db.auth.getSession()).data.session;if(session)await enter(session.user);else $('authBox').hidden=false}
async function enter(u){user=u;loadGreeting();lastGreeting=greetingForNow();$('userMail').textContent=u.email||'';$('userMail').hidden=!u.email;$('logoutBtn').hidden=false;const{data:profile}=await db.from('profiles').select('role').eq('id',u.id).maybeSingle();$('adminLink').hidden=profile?.role!=='admin';$('authBox').hidden=true;$('templateApp').hidden=false;await load()}$('sendCode').onclick=async()=>{const email=$('email').value.trim().toLowerCase();if(!email)return;const{error}=await db.auth.signInWithOtp({email,options:{shouldCreateUser:true}});if(error){$('authNote').textContent=error.message;return}$('authStep1').hidden=true;$('authStep2').hidden=false;$('authNote').textContent='Код надіслано. Перевірте пошту.'};$('verifyCode').onclick=async()=>{const{data,error}=await db.auth.verifyOtp({email:$('email').value.trim().toLowerCase(),token:$('code').value.trim(),type:'email'});if(error){$('authNote').textContent=error.message;return}await enter(data.user)};$('backLogin').onclick=()=>{$('authStep2').hidden=true;$('authStep1').hidden=false;$('authNote').textContent=''};
boot();setInterval(()=>{const current=greetingForNow();if(current!==lastGreeting){lastGreeting=current;const p=$('greetingPreview');if(p)p.textContent=greetingText();if(query)render()}},30000);
</script>
